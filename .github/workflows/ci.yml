name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check app/
      - run: ruff format --check app/

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
          POSTGRES_DB: cip
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Generate JWT keys for tests
        run: |
          python scripts/generate_jwt_keys.py
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://cip:cip@localhost:5432/cip
          DATABASE_URL_SYNC: postgresql://cip:cip@localhost:5432/cip
          REDIS_URL: redis://localhost:6379/0
          JWT_PRIVATE_KEY_PATH: jwt_private.pem
          JWT_PUBLIC_KEY_PATH: jwt_public.pem
          JWT_ALGORITHM: RS256
          ENVIRONMENT: test
        run: pytest --tb=short -q

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
