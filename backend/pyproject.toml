[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cip-backend"
version = "0.1.0"
description = "CIP — Compliance Infrastructure Platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.4.0",
    "psycopg2-binary>=2.9.0",
    "rapidfuzz>=3.0.0",
    "jellyfish>=1.0.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "deepface>=0.0.79",
    "opencv-python-headless>=4.8.0",
    "easyocr>=1.7.0",
    "mediapipe>=0.10.0",
    "xmlschema>=2.0.0",
    "structlog>=24.0.0",
    "weasyprint>=62.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.0.0",
    "locust>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", "alembic/versions"]
skips = ["B101"]  # assert_used — allow asserts in non-production paths
