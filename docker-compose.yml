# CIP Development Stack — Postgres, Redis, MinIO, API, Celery, Frontend
# Run from compliance/ directory: make dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip
      POSTGRES_DB: cip
    ports:
      - "5432:5432"
    volumes:
      - cip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip -d cip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cip_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cip:cip@postgres:5432/cip
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cip:cip@postgres:5432/cip
      DATABASE_URL_SYNC: postgresql://cip:cip@postgres:5432/cip
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    command: celery -A app.workers.celery_app worker -l info
    profiles:
      - full

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://cip:cip@postgres:5432/cip
      DATABASE_URL_SYNC: postgresql://cip:cip@postgres:5432/cip
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - celery-worker
    command: celery -A app.workers.celery_app beat -l info
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    env_file:
      - .env
    depends_on:
      - backend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  cip_postgres_data:
  cip_minio_data:
  frontend_node_modules:
